<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game - RPSLS</title>
    <link rel="stylesheet" href="/Styles/style.css">
</head>

<body class="game-page">
    <button id="homeBtn" class="home-btn">Home</button>

    <div class="game-container">
        <div class="game-board">
            <div class="player-section">
                <img id="img1" class="game-image" src="../Assets/rock.png" alt="Player choice">
            </div>

            <div class="vs-divider">
                <h1>VS</h1>
            </div>

            <div class="opponent-section">
                <img id="img2" class="game-image" src="../Assets/paper.png" alt="CPU choice">
            </div>
        </div>

        <div class="result-container">
            <div class="result-box">
                <h2 id="gameResult">You Win!</h2>
                <p id="resultDetail" class="result-detail">Press <strong>NEXT RND</strong> to continue</p>
            </div>
            <button id="playAgain" class="next-btn">NEXT RND</button>
        </div>
    </div>

    <script type="module" src="/Script/app.js"></script>
</body>

</html>
