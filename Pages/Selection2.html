<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player 2 - Selection - RPSLS</title>
    <link rel="stylesheet" href="/Styles/style.css">
</head>

<body class="selection-page">
    <button id="homeBtn" class="home-btn">Home</button>

    <div class="selection-container">
        <div class="choose-header">
            <h1 id="turnText">PLAYER 2 - CHOOSE</h1>
        </div>

        <div class="choices-grid">
            <button id="rockBtn" class="choice-card">
                <div class="choice-content">
                    <h2>ROCK</h2>
                    <img src="../Assets/rock.png" alt="Rock">
                </div>
            </button>

            <button id="paperBtn" class="choice-card">
                <div class="choice-content">
                    <h2>PAPER</h2>
                    <img src="../Assets/paper.png" alt="Paper">
                </div>
            </button>

            <button id="sissorsBtn" class="choice-card">
                <div class="choice-content">
                    <h2>SCISSORS</h2>
                    <img src="../Assets/scissors.png" alt="Scissors">
                </div>
            </button>

            <button id="spockBtn" class="choice-card">
                <div class="choice-content">
                    <h2>SPOCK</h2>
                    <img src="../Assets/spock.png" alt="Spock">
                </div>
            </button>

            <button id="lizardBtn" class="choice-card">
                <div class="choice-content">
                    <h2>LIZARD</h2>
                    <img src="../Assets/lizard.png" alt="Lizard">
                </div>
            </button>
        </div>
    </div>

    <script type="module" src="/Script/app.js"></script>
</body>

</html>
